<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Infinite Radio Remote</title>
  <style>
    :root {
      --bg: #111318;
      --card: #1c1f26;
      --border: #2d323e;
      --text: #eceff4;
      --muted: #8b949e;
      --accent: #58a6ff;
      --accent-hover: #388bfd;
      --success: #2ea043;
      --danger: #f85149;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      max-width: 680px;
      margin-inline: auto;
    }
    h1, h2 { margin-top: 0; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 0.95rem;
    }
    .badge {
      background: #262c36;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.85rem;
      color: var(--accent);
      font-family: monospace;
    }
    .controls {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 14px;
    }
    button {
      background: #262c36;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover { background: #303744; }
    button.primary {
      background: var(--accent);
      color: #0d1117;
      border-color: var(--accent);
      font-weight: 600;
    }
    button.primary:hover { background: var(--accent-hover); }
    button.danger {
      border-color: var(--danger);
      color: var(--danger);
    }
    .vote-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 8px 0;
      border-top: 1px solid var(--border);
    }
    .vote-btns { display: flex; gap: 6px; }
    .field { margin-bottom: 16px; }
    .field label {
      display: block;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 6px;
      font-weight: 600;
    }
    input[type="text"], input[type="number"], select {
      width: 100%;
      padding: 9px 12px;
      background: #14171d;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.95rem;
    }
    input[type="range"] { width: 100%; }
    .chips-container {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 8px;
      min-height: 28px;
    }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: #242b38;
      border: 1px solid #3b465c;
      color: var(--text);
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-family: monospace;
    }
    .chip button {
      all: unset;
      cursor: pointer;
      color: var(--muted);
      font-weight: bold;
      padding: 0 3px;
      font-size: 0.78rem;
    }
    .chip button:hover { color: var(--danger); }
    .picker-row {
      display: flex;
      gap: 8px;
      margin-bottom: 6px;
    }
    .picker-row select, .picker-row input { flex: 1; }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: var(--success);
      color: #fff;
      padding: 10px 16px;
      border-radius: 8px;
      display: none;
      font-weight: 600;
    }
    .tag {
      display: inline-block; background: #2d323e; padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; margin-right: 6px; margin-bottom: 4px; color: var(--accent); cursor: pointer; border: 1px solid transparent;
    }
    .tag:hover {
      text-decoration: line-through; border-color: var(--danger); color: var(--danger);
    }
    .tag-input {
      background: transparent; border: 1px dashed var(--border); border-radius: 4px; outline: none; color: var(--text); font-size: 0.75rem; width: 75px; padding: 3px 6px;
    }
    .tag-input:focus { border-color: var(--accent); }
    .tag-row-wrapper { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; width: 100%; }
  </style>
</head>
<body>

  <!-- Now Playing & Transport Controls -->
  <div class="card">
    <div class="status-row">
      <strong>📻 Infinite Radio</strong>
      <span id="queue-badge" class="badge">Queued: 0</span>
    </div>
    <div class="status-row">
      <span>Now Playing:</span>
      <span id="np-track" class="badge">Waiting...</span>
    </div>

    <div class="vote-row">
      <div class="tag-row-wrapper">
        <div style="display: flex; justify-content: space-between; width: 100%;">
          <div><small style="color:var(--muted)">Style:</small> <span id="np-style" style="font-family:monospace; font-size:0.9rem;">—</span></div>
          <div class="vote-btns">
            <button onclick="sendVote('style', 'up')">⭐</button>
            <button onclick="sendVote('style', 'down')">👎</button>
          </div>
        </div>
        <div style="padding-left: 2px; width: 100%;">
          <div id="style-tags-list" style="display:inline;"></div>
          <input type="text" class="tag-input" id="style-tag-input" placeholder="+ tag" onkeypress="handleTagInput(event, 'style', this)" />
        </div>
      </div>
    </div>

    <div class="vote-row">
      <div class="tag-row-wrapper">
        <div style="display: flex; justify-content: space-between; width: 100%;">
          <div><small style="color:var(--muted)">ABC Score:</small> <span id="np-abc" style="font-family:monospace; font-size:0.9rem;">—</span></div>
          <div class="vote-btns">
            <button onclick="sendVote('abc', 'up')">⭐</button>
            <button onclick="sendVote('abc', 'down')">👎</button>
          </div>
        </div>
        <div style="padding-left: 2px; width: 100%;">
          <div id="abc-tags-list" style="display:inline;"></div>
          <input type="text" class="tag-input" id="abc-tag-input" placeholder="+ tag" onkeypress="handleTagInput(event, 'abc', this)" />
        </div>
      </div>
    </div>

    <div class="field" style="margin-top: 12px; margin-bottom: 0;">
      <label>Volume: <span id="vol-label">40%</span></label>
      <input type="range" id="vol-slider" min="0" max="1" step="0.01" value="0.4" oninput="onVolumeSlide(this.value)" onchange="commitVolume(this.value)" />
    </div>

    <div class="controls">
      <button id="pause-btn" onclick="togglePause()">⏸️ Pause</button>
      <button onclick="skipTrack()">⏭️ Skip</button>
      <button onclick="saveTrack()">💾 Save</button>
    </div>
  </div>

  <!-- Collapsible Generation Settings -->
  <details class="card" open>
    <summary style="font-size: 1.1rem; font-weight: bold; cursor: pointer; user-select: none; outline: none;">
      ⚙️ Generation Settings
    </summary>
    
    <div style="margin-top: 16px;">
      <!-- Playlist Manager Section -->
      <div class="field" style="background: #141820; padding: 14px; border-radius: 8px; margin-bottom: 20px; border: 1px dashed #3b465c;">
        <label style="color: var(--text); font-size: 0.95rem; margin-bottom: 10px;">💾 Saved Playlists & Presets</label>
        
        <div class="picker-row">
          <select id="playlist-select">
            <option value="">-- Select a Playlist --</option>
          </select>
          <button onclick="loadPlaylist()" class="primary">Load</button>
          <button onclick="deletePlaylist()" class="danger">Delete</button>
        </div>
        
        <div class="picker-row" style="margin-top: 10px;">
          <input type="text" id="new-playlist-name" placeholder="Name for new playlist..." autocomplete="off" />
          <button onclick="saveCurrentAsPlaylist()">Save Current</button>
        </div>
      </div>

      <div class="status-row" style="margin-bottom: 14px;">
        <span style="font-size: 0.85rem; color: var(--muted);">Configure styles, ABC scores, and LoRAs.</span>
        <button onclick="refreshDiscovery()" style="padding: 5px 10px; font-size: 0.8rem;">🔄 Refresh Directories</button>
      </div>

      <!-- Active Styles Multi-Select -->
      <div class="field">
        <label>Active Styles (Folders or JSON files)</label>
        <div id="style-chips" class="chips-container"></div>
        <div class="picker-row">
          <input type="text" id="style-picker" list="style-list" placeholder="Search discovered styles or type custom path..." autocomplete="off" onkeypress="if(event.key === 'Enter') addFromPicker('style-picker', activeStyles, renderStyleChips)" />
          <datalist id="style-list"></datalist>
          <button onclick="addFromPicker('style-picker', activeStyles, renderStyleChips)">Add</button>
        </div>
      </div>

      <!-- ABC Score Directories Multi-Select -->
      <div class="field">
        <label>ABC Score Directories (Relative to ABC Base Dir)</label>
        <div id="abc-chips" class="chips-container"></div>
        <div class="picker-row">
          <input type="text" id="abc-picker" list="abc-list" placeholder="Search discovered ABCs or type custom path..." autocomplete="off" onkeypress="if(event.key === 'Enter') addFromPicker('abc-picker', activeAbc, renderAbcChips)" />
          <datalist id="abc-list"></datalist>
          <button onclick="addFromPicker('abc-picker', activeAbc, renderAbcChips)">Add</button>
          <button onclick="clearAbc()" title="Disable ABC conditioning">Clear All</button>
        </div>
      </div>

      <div class="grid-2">
        <div class="field">
          <label>CoT Mode</label>
          <select id="cot-select">
            <option value="melody">melody (*-melody.abc)</option>
            <option value="full">full (*-full.abc)</option>
            <option value="all">all (*.abc)</option>
          </select>
        </div>
        <div class="field">
          <label>ABC Playback Order</label>
          <select id="abc-order-select">
            <option value="random">🔀 Random (Smart Shuffle)</option>
            <option value="sequential">🔁 Sequential (In Order)</option>
          </select>
        </div>
      </div>

      <div class="grid-2">
        <div class="field">
          <label>ABC Base Directory</label>
          <input type="text" id="abc-base-dir" value="sheetsage/output" />
        </div>
        <div class="field">
          <label>Strip ABC Tempo (Q: tags)</label>
          <select id="strip-abc-tempo">
            <option value="true">✅ Enabled</option>
            <option value="false">❌ Disabled</option>
          </select>
        </div>
      </div>

      <div class="grid-2">
        <div class="field">
          <label>BPM Modification</label>
          <select id="enable-bpm-modification">
            <option value="true">✅ Enabled</option>
            <option value="false">❌ Disabled</option>
          </select>
        </div>
        <div class="field">
          <label>BPM Source (If no override)</label>
          <select id="bpm-source">
            <option value="style">Style Random Choice</option>
            <option value="abc">ABC File (Q: tag)</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label>BPM Override (Empty = Auto)</label>
        <input type="number" id="bpm-override" placeholder="e.g. 120" min="1" max="999" />
      </div>

      <div class="grid-2">
        <div class="field">
          <label>AR LoRA</label>
          <select id="ar-lora-select"></select>
        </div>
        <div class="field">
          <label>AR Scale</label>
          <input type="number" id="ar-scale" step="0.05" value="0.5" />
        </div>
      </div>

      <div class="grid-2">
        <div class="field">
          <label>NAR LoRA</label>
          <select id="nar-lora-select"></select>
        </div>
        <div class="field">
          <label>NAR Scale</label>
          <input type="number" id="nar-scale" step="0.05" value="1.0" />
        </div>
      </div>
    </div>
  </details>

  <!-- Collapsible DSP & Post-Processing Settings -->
  <details class="card">
    <summary style="font-size: 1.1rem; font-weight: bold; cursor: pointer; user-select: none; outline: none;">
      🎛️ DSP & Post-Processing
    </summary>
    
    <div style="margin-top: 16px;">
      <div class="grid-2">
        <div class="field">
          <label>Normalization</label>
          <select id="enable-normalization">
            <option value="true">✅ Enabled</option>
            <option value="false">❌ Disabled</option>
          </select>
        </div>
        <div class="field">
          <label>Target LUFS</label>
          <input type="number" id="target-lufs" step="0.5" value="-14.0" />
        </div>
      </div>

      <hr style="border-color: var(--border); margin: 16px 0;" />

      <div class="field">
        <label>Reverb Effect</label>
        <select id="enable-reverb" onchange="liveDSPUpdate()">
          <option value="true">✅ Enabled</option>
          <option value="false">❌ Disabled</option>
        </select>
      </div>

      <div class="grid-2">
        <div class="field">
          <label>Room Size (0-1)</label>
          <input type="range" id="reverb-room" step="0.01" min="0" max="1" value="0.3" oninput="liveDSPUpdate()" />
        </div>
        <div class="field">
          <label>Damping (0-1)</label>
          <input type="range" id="reverb-damping" step="0.01" min="0" max="1" value="0.5" oninput="liveDSPUpdate()" />
        </div>
      </div>

      <div class="grid-2">
        <div class="field">
          <label>Wet Level (0-1)</label>
          <input type="range" id="reverb-wet" step="0.01" min="0" max="1" value="0.15" oninput="liveDSPUpdate()" />
        </div>
        <div class="field">
          <label>Dry Level (0-1)</label>
          <input type="range" id="reverb-dry" step="0.01" min="0" max="1" value="0.85" oninput="liveDSPUpdate()" />
        </div>
      </div>
    </div>
  </details>

  <!-- Action Buttons -->
  <div class="picker-row" style="margin-bottom: 24px;">
    <button class="primary" style="flex: 2; padding: 12px; font-size: 1.05rem;" onclick="saveConfig()">💾 Apply Config</button>
    <button class="danger" style="flex: 1; padding: 12px; font-size: 1.05rem;" onclick="flushQueue()">🧹 Flush Queue</button>
  </div>

  <div id="toast" class="toast">Saved!</div>

  <script>
    let currentPaused = false;
    let activeStyles = [];
    let activeAbc = [];
    let rawConfig = {};
    let isDraggingVolume = false;
    let playlistsData = {};
    let currentTags = { style: [], abc: [] };

    function showToast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.style.display = "block";
      setTimeout(() => { t.style.display = "none"; }, 2200);
    }

    function normalizeList(val) {
      if (!val) return [];
      if (Array.isArray(val)) return val.filter(Boolean);
      if (typeof val === "string") return val.split(",").map(s => s.trim()).filter(Boolean);
      return [];
    }

    function renderChips(containerId, list, removeCallback, moveCallback = null) {
      const container = document.getElementById(containerId);
      container.innerHTML = "";
      if (list.length === 0) {
        container.innerHTML = `<span style="color:var(--muted); font-size:0.85rem;">None selected</span>`;
        return;
      }
      list.forEach((item, idx) => {
        const chip = document.createElement("span");
        chip.className = "chip";
        const moveLeft = (moveCallback && idx > 0)
          ? `<button onclick="${moveCallback}(${idx}, -1)" title="Move earlier">◀</button>` : "";
        const moveRight = (moveCallback && idx < list.length - 1)
          ? `<button onclick="${moveCallback}(${idx}, 1)" title="Move later">▶</button>` : "";
        chip.innerHTML = `${moveLeft}${item}${moveRight} <button onclick="${removeCallback}(${idx})" title="Remove">&times;</button>`;
        container.appendChild(chip);
      });
    }

    function renderStyleChips() { renderChips("style-chips", activeStyles, "removeStyle"); }
    function renderAbcChips() { renderChips("abc-chips", activeAbc, "removeAbc", "moveAbc"); }

    function removeStyle(idx) { activeStyles.splice(idx, 1); renderStyleChips(); }
    function removeAbc(idx) { activeAbc.splice(idx, 1); renderAbcChips(); }
    function clearAbc() { activeAbc = []; renderAbcChips(); }

    function moveAbc(idx, dir) {
      const target = idx + dir;
      if (target < 0 || target >= activeAbc.length) return;
      [activeAbc[idx], activeAbc[target]] = [activeAbc[target], activeAbc[idx]];
      renderAbcChips();
    }

    function addFromPicker(pickerId, targetList, renderFn) {
      const sel = document.getElementById(pickerId);
      const val = sel.value.trim();
      if (val && !targetList.includes(val)) {
        targetList.push(val);
        renderFn();
      }
      sel.value = "";
    }

    async function loadOptions() {
      const res = await fetch("/api/options");
      const data = await res.json();

      // Populate LoRAs
      ["ar-lora-select", "nar-lora-select"].forEach(id => {
        const sel = document.getElementById(id);
        const currentVal = sel.value;
        sel.innerHTML = `<option value="">(None)</option>`;
        (data.loras || []).forEach(lora => {
          const opt = document.createElement("option");
          opt.value = lora;
          opt.textContent = lora;
          sel.appendChild(opt);
        });
        if (currentVal) sel.value = currentVal;
      });

      // Populate Styles Datalist
      const styleList = document.getElementById("style-list");
      styleList.innerHTML = "";
      if (data.styles?.folders?.length) {
        data.styles.folders.forEach(f => {
          const opt = document.createElement("option");
          opt.value = f;
          styleList.appendChild(opt);
        });
      }
      if (data.styles?.files?.length) {
        data.styles.files.forEach(f => {
          const opt = document.createElement("option");
          opt.value = f;
          styleList.appendChild(opt);
        });
      }
      if (data.styles?.tags?.length) {
        data.styles.tags.forEach(t => {
          const opt = document.createElement("option");
          opt.value = t;
          styleList.appendChild(opt);
        });
      }

      // Populate ABC Datalist
      const abcList = document.getElementById("abc-list");
      abcList.innerHTML = "";
      if (data.abc?.collections?.length) {
        data.abc.collections.forEach(c => {
          const opt = document.createElement("option");
          opt.value = c;
          abcList.appendChild(opt);
        });
      }
      if (data.abc?.songs?.length) {
        data.abc.songs.forEach(s => {
          const opt = document.createElement("option");
          opt.value = s;
          abcList.appendChild(opt);
        });
      }
      if (data.abc?.tags?.length) {
        data.abc.tags.forEach(t => {
          const opt = document.createElement("option");
          opt.value = t;
          abcList.appendChild(opt);
        });
      }
    }

    async function refreshDiscovery() {
      await fetch("/api/options?refresh=true");
      await loadOptions();
      showToast("Directories refreshed!");
    }

    async function loadConfig() {
      const res = await fetch("/api/config");
      rawConfig = await res.json();

      activeStyles = normalizeList(rawConfig.active_style);
      activeAbc = normalizeList(rawConfig.abc);
      renderStyleChips();
      renderAbcChips();

      document.getElementById("cot-select").value = rawConfig.cot || "melody";
      document.getElementById("abc-order-select").value = rawConfig.abc_order || "random";
      document.getElementById("abc-base-dir").value = rawConfig.abc_base_dir || "sheetsage/output";
      document.getElementById("strip-abc-tempo").value = rawConfig.strip_abc_tempo ? "true" : "false";
      
      document.getElementById("enable-bpm-modification").value = rawConfig.enable_bpm_modification !== false ? "true" : "false";
      document.getElementById("bpm-source").value = rawConfig.bpm_source || "style";
      document.getElementById("bpm-override").value = rawConfig.bpm_override || "";
      
      document.getElementById("ar-lora-select").value = rawConfig.ar_lora || "";
      document.getElementById("nar-lora-select").value = rawConfig.nar_lora || "";
      document.getElementById("ar-scale").value = rawConfig.ar_scale ?? 0.5;
      document.getElementById("nar-scale").value = rawConfig.nar_scale ?? 1.0;

      // Map DSP and Post-Processing config state
      document.getElementById("enable-normalization").value = rawConfig.enable_normalization !== false ? "true" : "false";
      document.getElementById("enable-reverb").value = rawConfig.enable_reverb !== false ? "true" : "false";
      document.getElementById("target-lufs").value = rawConfig.target_lufs ?? -14.0;
      document.getElementById("reverb-room").value = rawConfig.reverb_room_size ?? 0.3;
      document.getElementById("reverb-damping").value = rawConfig.reverb_damping ?? 0.5;
      document.getElementById("reverb-wet").value = rawConfig.reverb_wet_level ?? 0.15;
      document.getElementById("reverb-dry").value = rawConfig.reverb_dry_level ?? 0.85;
    }

    async function saveConfig() {
      const bpmVal = document.getElementById("bpm-override").value;

      const updated = {
        ...rawConfig,
        active_style: activeStyles,
        abc: activeAbc,
        cot: document.getElementById("cot-select").value,
        abc_order: document.getElementById("abc-order-select").value,
        abc_base_dir: document.getElementById("abc-base-dir").value.trim(),
        strip_abc_tempo: document.getElementById("strip-abc-tempo").value === "true",
        
        enable_bpm_modification: document.getElementById("enable-bpm-modification").value === "true",
        bpm_source: document.getElementById("bpm-source").value,
        bpm_override: bpmVal ? parseInt(bpmVal, 10) : null,
        
        ar_lora: document.getElementById("ar-lora-select").value || null,
        nar_lora: document.getElementById("nar-lora-select").value || null,
        ar_scale: parseFloat(document.getElementById("ar-scale").value),
        nar_scale: parseFloat(document.getElementById("nar-scale").value),

        // Read DSP state out of the UI
        enable_normalization: document.getElementById("enable-normalization").value === "true",
        enable_reverb: document.getElementById("enable-reverb").value === "true",
        target_lufs: parseFloat(document.getElementById("target-lufs").value),
        reverb_room_size: parseFloat(document.getElementById("reverb-room").value),
        reverb_damping: parseFloat(document.getElementById("reverb-damping").value),
        reverb_wet_level: parseFloat(document.getElementById("reverb-wet").value),
        reverb_dry_level: parseFloat(document.getElementById("reverb-dry").value),
      };

      await fetch("/api/config", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ settings: updated }),
      });
      await loadOptions();
      showToast("Configuration saved!");
    }

    async function fetchPlaylists() {
      try {
        const res = await fetch("/api/playlists");
        const data = await res.json();
        playlistsData = data.playlists || {};
        
        const sel = document.getElementById("playlist-select");
        // Keep the first default option
        sel.innerHTML = '<option value="">-- Select a Playlist --</option>';
        
        Object.keys(playlistsData).sort().forEach(name => {
          const opt = document.createElement("option");
          opt.value = name;
          opt.textContent = name;
          sel.appendChild(opt);
        });
      } catch (err) {
        console.error("Failed to load playlists", err);
      }
    }

    async function loadPlaylist() {
      const name = document.getElementById("playlist-select").value;
      if (!name || !playlistsData[name]) return;
      
      const pl = playlistsData[name];
      activeStyles = pl.active_style || [];
      activeAbc = pl.abc || [];
      document.getElementById("abc-order-select").value = pl.abc_order || "random";
      document.getElementById("cot-select").value = pl.cot || "melody";
      
      renderStyleChips();
      renderAbcChips();
      
      // Automatically apply the configuration to the backend
      await saveConfig();
      showToast(`Loaded playlist: ${name}`);
    }

    async function saveCurrentAsPlaylist() {
      const name = document.getElementById("new-playlist-name").value.trim();
      if (!name) {
        alert("Please enter a name for the playlist.");
        return;
      }

      const playlistState = {
        active_style: activeStyles,
        abc: activeAbc,
        abc_order: document.getElementById("abc-order-select").value,
        cot: document.getElementById("cot-select").value
      };

      await fetch("/api/playlists", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name: name, playlist: playlistState })
      });

      showToast(`Saved playlist: ${name}`);
      document.getElementById("new-playlist-name").value = "";
      
      // Refresh the dropdown and auto-select the new playlist
      await fetchPlaylists();
      document.getElementById("playlist-select").value = name;
    }

    async function deletePlaylist() {
      const name = document.getElementById("playlist-select").value;
      if (!name) return;
      
      if (!confirm(`Are you sure you want to delete the playlist '${name}'?`)) return;

      await fetch(`/api/playlists?name=${encodeURIComponent(name)}`, { method: "DELETE" });
      
      showToast("Playlist deleted!");
      await fetchPlaylists();
    }

    let dspTimeout;
    function liveDSPUpdate() {
      clearTimeout(dspTimeout);
      dspTimeout = setTimeout(async () => {
        const payload = {
          enable_normalization: document.getElementById("enable-normalization").value === "true",
          enable_reverb: document.getElementById("enable-reverb").value === "true",
          reverb_room_size: parseFloat(document.getElementById("reverb-room").value),
          reverb_damping: parseFloat(document.getElementById("reverb-damping").value),
          reverb_wet_level: parseFloat(document.getElementById("reverb-wet").value),
          reverb_dry_level: parseFloat(document.getElementById("reverb-dry").value),
        };
        
        await fetch("/api/dsp", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
      }, 50); // 50ms debounce ensures smooth slider dragging
    }

    function renderLiveTags(listId, newTags, feature) {
      if (JSON.stringify(currentTags[feature]) === JSON.stringify(newTags)) return;
      currentTags[feature] = newTags;

      const list = document.getElementById(listId);
      list.innerHTML = "";
      newTags.forEach(tag => {
        const el = document.createElement("span");
        el.className = "tag";
        el.textContent = `#${tag}`;
        el.title = "Click to remove";
        el.onclick = () => submitTagUpdate(feature, 'remove', tag);
        list.appendChild(el);
      });
    }

    async function handleTagInput(e, feature, inputEl) {
      if (e.key === 'Enter') {
        const val = inputEl.value.trim();
        if (val) {
          await submitTagUpdate(feature, 'add', val);
          inputEl.value = "";
        }
      }
    }

    async function submitTagUpdate(feature, action, tag) {
      const res = await fetch("/api/tag", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ feature, action, tag }) });
      if (!res.ok) { const data = await res.json(); showToast(data.detail || "Failed to update tag"); }
      else if (action === "add") { loadOptions(); } // Refresh UI datalists with new tags silently
    }

    function connectSSE() {
      const evtSource = new EventSource("/api/stream");
      
      evtSource.onmessage = function(event) {
        const state = JSON.parse(event.data);
        
        document.getElementById("queue-badge").textContent = `Queued: ${state.queued}`;
        document.getElementById("np-track").textContent = state.track || "Buffering...";
        document.getElementById("np-style").textContent = state.style || "—";
        document.getElementById("np-abc").textContent = state.abc || "None";

        currentPaused = state.paused;
        document.getElementById("pause-btn").textContent = currentPaused ? "▶️ Resume" : "⏸️ Pause";
        
        renderLiveTags("style-tags-list", state.style_tags || [], "style");
        renderLiveTags("abc-tags-list", state.abc_tags || [], "abc");
        
        // Prevent volume slider from jumping around if the user is actively sliding it
        if (!isDraggingVolume) {
          const slider = document.getElementById("vol-slider");
          if (Math.abs(slider.value - state.volume) > 0.01) {
            slider.value = state.volume;
            document.getElementById("vol-label").textContent = `${Math.round(state.volume * 100)}%`;
          }
        }
      };

      evtSource.onerror = function(err) {
        console.error("SSE connection error. Reconnecting...", err);
      };
    }

    function onVolumeSlide(val) {
      isDraggingVolume = true;
      document.getElementById("vol-label").textContent = `${Math.round(val * 100)}%`;
    }

    async function commitVolume(val) {
      onVolumeSlide(val);
      await fetch(`/api/volume?level=${encodeURIComponent(val)}`, { method: "POST" });
      isDraggingVolume = false;
    }

    // Capture mousedown/touchstart to reliably track drag states
    const volSlider = document.getElementById("vol-slider");
    volSlider.addEventListener('mousedown', () => isDraggingVolume = true);
    volSlider.addEventListener('touchstart', () => isDraggingVolume = true);
    volSlider.addEventListener('mouseup', () => isDraggingVolume = false);
    volSlider.addEventListener('touchend', () => isDraggingVolume = false);

    async function togglePause() {
      await fetch(`/api/pause?state=${!currentPaused}`, { method: "POST" });
    }

    async function skipTrack() {
      await fetch("/api/skip", { method: "POST" });
      showToast("Skipping track...");
    }

    async function saveTrack() {
      const res = await fetch("/api/save", { method: "POST" });
      if (res.ok) showToast("Track saved to disk!");
      else showToast("Could not save track");
    }

    async function flushQueue() {
      const res = await fetch("/api/flush", { method: "POST" });
      const data = await res.json();
      showToast(`Flushed ${data.flushed} queued track(s)`);
    }

    async function sendVote(feature, type) {
      const res = await fetch(`/api/vote/${feature}/${type}`, { method: "POST" });
      if (res.ok) showToast(`Voted ${type} on ${feature}!`);
    }

    (async function init() {
      await loadOptions();
      await loadConfig();
      await fetchPlaylists();
      connectSSE();
    })();
  </script>
</body>
</html>
