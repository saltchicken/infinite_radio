<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Infinite Radio Remote</title>
  <style>
    :root {
      --bg: #111318;
      --card: #1c1f26;
      --border: #2d323e;
      --text: #eceff4;
      --muted: #8b949e;
      --accent: #58a6ff;
      --accent-hover: #388bfd;
      --success: #2ea043;
      --danger: #f85149;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      max-width: 680px;
      margin-inline: auto;
    }
    h1, h2 { margin-top: 0; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 0.95rem;
    }
    .badge {
      background: #262c36;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.85rem;
      color: var(--accent);
      font-family: monospace;
    }
    .controls {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 14px;
    }
    button {
      background: #262c36;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover { background: #303744; }
    button.primary {
      background: var(--accent);
      color: #0d1117;
      border-color: var(--accent);
      font-weight: 600;
    }
    button.primary:hover { background: var(--accent-hover); }
    button.danger {
      border-color: var(--danger);
      color: var(--danger);
    }
    .vote-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 8px 0;
      border-top: 1px solid var(--border);
    }
    .vote-btns { display: flex; gap: 6px; }
    .field { margin-bottom: 16px; }
    .field label {
      display: block;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 6px;
      font-weight: 600;
    }
    input[type="text"], input[type="number"], select {
      width: 100%;
      padding: 9px 12px;
      background: #14171d;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.95rem;
    }
    input[type="range"] { width: 100%; }
    .chips-container {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 8px;
      min-height: 28px;
    }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #242b38;
      border: 1px solid #3b465c;
      color: var(--text);
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-family: monospace;
    }
    .chip button {
      all: unset;
      cursor: pointer;
      color: var(--muted);
      font-weight: bold;
      padding: 0 2px;
    }
    .chip button:hover { color: var(--danger); }
    .picker-row {
      display: flex;
      gap: 8px;
      margin-bottom: 6px;
    }
    .picker-row select, .picker-row input { flex: 1; }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: var(--success);
      color: #fff;
      padding: 10px 16px;
      border-radius: 8px;
      display: none;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <!-- Now Playing & Transport Controls -->
  <div class="card">
    <div class="status-row">
      <strong>📻 Infinite Radio</strong>
      <span id="queue-badge" class="badge">Queued: 0</span>
    </div>
    <div class="status-row">
      <span>Now Playing:</span>
      <span id="np-track" class="badge">Waiting...</span>
    </div>

    <div class="vote-row">
      <div>
        <small style="color:var(--muted)">Style:</small>
        <div id="np-style" style="font-family:monospace; font-size:0.9rem;">—</div>
      </div>
      <div class="vote-btns">
        <button onclick="sendVote('style', 'up')">⭐</button>
        <button onclick="sendVote('style', 'down')">👎</button>
      </div>
    </div>

    <div class="vote-row">
      <div>
        <small style="color:var(--muted)">ABC Score:</small>
        <div id="np-abc" style="font-family:monospace; font-size:0.9rem;">—</div>
      </div>
      <div class="vote-btns">
        <button onclick="sendVote('abc', 'up')">⭐</button>
        <button onclick="sendVote('abc', 'down')">👎</button>
      </div>
    </div>

    <div class="field" style="margin-top: 12px; margin-bottom: 0;">
      <label>Volume: <span id="vol-label">40%</span></label>
      <input type="range" id="vol-slider" min="0" max="1" step="0.01" value="0.4" oninput="onVolumeSlide(this.value)" onchange="commitVolume(this.value)" />
    </div>

    <div class="controls">
      <button id="pause-btn" onclick="togglePause()">⏸️ Pause</button>
      <button onclick="skipTrack()">⏭️ Skip</button>
      <button onclick="saveTrack()">💾 Save</button>
    </div>
  </div>

  <!-- Generation & Dynamic Directory Discovery -->
  <div class="card">
    <div class="status-row" style="margin-bottom: 14px;">
      <h2 style="font-size: 1.1rem; margin: 0;">⚙️ Generation Settings</h2>
      <button onclick="refreshDiscovery()" style="padding: 5px 10px; font-size: 0.8rem;">🔄 Refresh Directories</button>
    </div>

    <!-- Active Styles Multi-Select -->
    <div class="field">
      <label>Active Styles (Folders or JSON files)</label>
      <div id="style-chips" class="chips-container"></div>
      <div class="picker-row">
        <select id="style-picker">
          <option value="">+ Add discovered style folder or file...</option>
        </select>
        <button onclick="addFromPicker('style-picker', activeStyles, renderStyleChips)">Add</button>
      </div>
      <div class="picker-row">
        <input type="text" id="custom-style-input" placeholder="Or type custom style path..." />
        <button onclick="addCustom('custom-style-input', activeStyles, renderStyleChips)">Add Path</button>
      </div>
    </div>

    <!-- ABC Score Directories Multi-Select -->
    <div class="field">
      <label>ABC Score Directories (Relative to ABC Base Dir)</label>
      <div id="abc-chips" class="chips-container"></div>
      <div class="picker-row">
        <select id="abc-picker">
          <option value="">+ Add discovered soundtrack or song folder...</option>
        </select>
        <button onclick="addFromPicker('abc-picker', activeAbc, renderAbcChips)">Add</button>
        <button onclick="clearAbc()" title="Disable ABC conditioning">Clear All</button>
      </div>
      <div class="picker-row">
        <input type="text" id="custom-abc-input" placeholder="Or type custom ABC path..." />
        <button onclick="addCustom('custom-abc-input', activeAbc, renderAbcChips)">Add Path</button>
      </div>
    </div>

    <div class="grid-2">
      <div class="field">
        <label>CoT Mode</label>
        <select id="cot-select">
          <option value="melody">melody (*-melody.abc)</option>
          <option value="full">full (*-full.abc)</option>
          <option value="all">all (*.abc)</option>
        </select>
      </div>
      <div class="field">
        <label>ABC Base Directory</label>
        <input type="text" id="abc-base-dir" value="sheetsage/output" />
      </div>
    </div>

    <div class="grid-2">
      <div class="field">
        <label>AR LoRA</label>
        <select id="ar-lora-select"></select>
      </div>
      <div class="field">
        <label>AR Scale</label>
        <input type="number" id="ar-scale" step="0.05" value="0.5" />
      </div>
    </div>

    <div class="grid-2">
      <div class="field">
        <label>NAR LoRA</label>
        <select id="nar-lora-select"></select>
      </div>
      <div class="field">
        <label>NAR Scale</label>
        <input type="number" id="nar-scale" step="0.05" value="1.0" />
      </div>
    </div>

    <div class="picker-row" style="margin-top: 8px;">
      <button class="primary" style="flex: 2;" onclick="saveConfig()">💾 Apply Config</button>
      <button class="danger" style="flex: 1;" onclick="flushQueue()">🧹 Flush Queue</button>
    </div>
  </div>

  <div id="toast" class="toast">Saved!</div>

  <script>
    let currentPaused = false;
    let activeStyles = [];
    let activeAbc = [];
    let rawConfig = {};

    function showToast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.style.display = "block";
      setTimeout(() => { t.style.display = "none"; }, 2200);
    }

    function normalizeList(val) {
      if (!val) return [];
      if (Array.isArray(val)) return val.filter(Boolean);
      if (typeof val === "string") return val.split(",").map(s => s.trim()).filter(Boolean);
      return [];
    }

    function renderChips(containerId, list, removeCallback) {
      const container = document.getElementById(containerId);
      container.innerHTML = "";
      if (list.length === 0) {
        container.innerHTML = `<span style="color:var(--muted); font-size:0.85rem;">None selected</span>`;
        return;
      }
      list.forEach((item, idx) => {
        const chip = document.createElement("span");
        chip.className = "chip";
        chip.innerHTML = `${item} <button onclick="${removeCallback}(${idx})" title="Remove">&times;</button>`;
        container.appendChild(chip);
      });
    }

    function renderStyleChips() { renderChips("style-chips", activeStyles, "removeStyle"); }
    function renderAbcChips() { renderChips("abc-chips", activeAbc, "removeAbc"); }

    function removeStyle(idx) { activeStyles.splice(idx, 1); renderStyleChips(); }
    function removeAbc(idx) { activeAbc.splice(idx, 1); renderAbcChips(); }
    function clearAbc() { activeAbc = []; renderAbcChips(); }

    function addFromPicker(pickerId, targetList, renderFn) {
      const sel = document.getElementById(pickerId);
      const val = sel.value;
      if (val && !targetList.includes(val)) {
        targetList.push(val);
        renderFn();
      }
      sel.value = "";
    }

    function addCustom(inputId, targetList, renderFn) {
      const inp = document.getElementById(inputId);
      const val = inp.value.trim();
      if (val && !targetList.includes(val)) {
        targetList.push(val);
        renderFn();
      }
      inp.value = "";
    }

    async function loadOptions() {
      const res = await fetch("/api/options");
      const data = await res.json();

      // Populate LoRAs
      ["ar-lora-select", "nar-lora-select"].forEach(id => {
        const sel = document.getElementById(id);
        const currentVal = sel.value;
        sel.innerHTML = `<option value="">(None)</option>`;
        (data.loras || []).forEach(lora => {
          const opt = document.createElement("option");
          opt.value = lora;
          opt.textContent = lora;
          sel.appendChild(opt);
        });
        if (currentVal) sel.value = currentVal;
      });

      // Populate Styles Picker (Grouped by Folders vs Files)
      const stylePicker = document.getElementById("style-picker");
      stylePicker.innerHTML = `<option value="">+ Add discovered style folder or file...</option>`;
      if (data.styles?.folders?.length) {
        const grp = document.createElement("optgroup");
        grp.label = "📁 Style Folders";
        data.styles.folders.forEach(f => {
          const opt = document.createElement("option");
          opt.value = f;
          opt.textContent = f;
          grp.appendChild(opt);
        });
        stylePicker.appendChild(grp);
      }
      if (data.styles?.files?.length) {
        const grp = document.createElement("optgroup");
        grp.label = "📄 Style JSON Files";
        data.styles.files.forEach(f => {
          const opt = document.createElement("option");
          opt.value = f;
          opt.textContent = f;
          grp.appendChild(opt);
        });
        stylePicker.appendChild(grp);
      }

      // Populate ABC Picker (Grouped by Collections/Games vs Individual Song Scores)
      const abcPicker = document.getElementById("abc-picker");
      abcPicker.innerHTML = `<option value="">+ Add discovered soundtrack or song folder...</option>`;
      if (data.abc?.collections?.length) {
        const grp = document.createElement("optgroup");
        grp.label = "🎮 Soundtrack / Collection Folders";
        data.abc.collections.forEach(c => {
          const opt = document.createElement("option");
          opt.value = c;
          opt.textContent = c;
          grp.appendChild(opt);
        });
        abcPicker.appendChild(grp);
      }
      if (data.abc?.songs?.length) {
        const grp = document.createElement("optgroup");
        grp.label = "🎵 Individual Song Score Folders";
        data.abc.songs.forEach(s => {
          const opt = document.createElement("option");
          opt.value = s;
          opt.textContent = s;
          grp.appendChild(opt);
        });
        abcPicker.appendChild(grp);
      }
    }

    async function refreshDiscovery() {
      await loadOptions();
      showToast("Directories refreshed!");
    }

    async function loadConfig() {
      const res = await fetch("/api/config");
      rawConfig = await res.json();

      activeStyles = normalizeList(rawConfig.active_style);
      activeAbc = normalizeList(rawConfig.abc);
      renderStyleChips();
      renderAbcChips();

      document.getElementById("cot-select").value = rawConfig.cot || "melody";
      document.getElementById("abc-base-dir").value = rawConfig.abc_base_dir || "sheetsage/output";
      document.getElementById("ar-lora-select").value = rawConfig.ar_lora || "";
      document.getElementById("nar-lora-select").value = rawConfig.nar_lora || "";
      document.getElementById("ar-scale").value = rawConfig.ar_scale ?? 0.5;
      document.getElementById("nar-scale").value = rawConfig.nar_scale ?? 1.0;
    }

    async function saveConfig() {
      const updated = {
        ...rawConfig,
        active_style: activeStyles,
        abc: activeAbc,
        cot: document.getElementById("cot-select").value,
        abc_base_dir: document.getElementById("abc-base-dir").value.trim(),
        ar_lora: document.getElementById("ar-lora-select").value || null,
        nar_lora: document.getElementById("nar-lora-select").value || null,
        ar_scale: parseFloat(document.getElementById("ar-scale").value),
        nar_scale: parseFloat(document.getElementById("nar-scale").value),
      };

      await fetch("/api/config", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ settings: updated }),
      });
      await loadOptions();
      showToast("Configuration saved!");
    }

    async function pollState() {
      try {
        const res = await fetch("/api/state");
        const state = await res.json();
        document.getElementById("queue-badge").textContent = `Queued: ${state.queued}`;
        document.getElementById("np-track").textContent = state.track || "Buffering...";
        document.getElementById("np-style").textContent = state.style || "—";
        document.getElementById("np-abc").textContent = state.abc || "None";

        currentPaused = state.paused;
        document.getElementById("pause-btn").textContent = currentPaused ? "▶️ Resume" : "⏸️ Pause";
      } catch (e) {}
    }

    function onVolumeSlide(val) {
      document.getElementById("vol-label").textContent = `${Math.round(val * 100)}%`;
    }

    async function commitVolume(val) {
      onVolumeSlide(val);
      await fetch(`/api/volume?level=${encodeURIComponent(val)}`, { method: "POST" });
    }

    async function togglePause() {
      await fetch(`/api/pause?state=${!currentPaused}`, { method: "POST" });
      pollState();
    }

    async function skipTrack() {
      await fetch("/api/skip", { method: "POST" });
      showToast("Skipping track...");
    }

    async function saveTrack() {
      const res = await fetch("/api/save", { method: "POST" });
      if (res.ok) showToast("Track saved to disk!");
      else showToast("Could not save track");
    }

    async function flushQueue() {
      const res = await fetch("/api/flush", { method: "POST" });
      const data = await res.json();
      showToast(`Flushed ${data.flushed} queued track(s)`);
      pollState();
    }

    async function sendVote(feature, type) {
      const res = await fetch(`/api/vote/${feature}/${type}`, { method: "POST" });
      if (res.ok) showToast(`Voted ${type} on ${feature}!`);
    }

    (async function init() {
      await loadOptions();
      await loadConfig();
      await pollState();
      setInterval(pollState, 2000);
    })();
  </script>
</body>
</html>
