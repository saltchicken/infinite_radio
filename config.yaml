# --- Generation & Playback Defaults ---
volume: 0.4
pause: false
active_style:
  - "styles/"
abc_order: "random"
cot: "melody"
abc_base_dir: "sheetsage/output"
abc: "vgm/"

# === BPM CONTROL SYSTEM ===

# enable_bpm_modification:
#   true = Actively calculates a target BPM and injects it into both the prompt and the ABC file.
#   false = Hands-off mode. Leaves the prompt and ABC file completely untouched.
enable_bpm_modification: false

# bpm_source: Where to get the target BPM if the override box is empty.
#   "style" = Picks a random BPM from the choices in your style's .json file.
#   "abc" = Extracts the natural tempo (Q: tag) written inside the sheet music.
bpm_source: "abc"

# bpm_override: Absolute top-priority master override (e.g. 150). Leave empty to use bpm_source.
bpm_override:

# strip_abc_tempo:
#   true = Deletes Q: tags from the ABC file entirely.
#   (Note: If enable_bpm_modification is true and a target BPM is found, it will overwrite the tempo instead of stripping it).
strip_abc_tempo: false

# --- LoRA Defaults ---
ar_scale: 0.5
nar_scale: 1.0

# --- DSP & Post-Processing (Updated) ---
# Normalization (LUFS)
enable_normalization: true
target_lufs: -14.0

# Live Reverb Effect
enable_reverb: true
reverb_room_size: 0.3
reverb_damping: 0.5
reverb_wet_level: 0.05
reverb_dry_level: 0.95
