# --- Generation & Playback Defaults ---
volume: 0.4
pause: false
active_style:
  - "styles/"
abc_order: "random"
cot: "melody"
abc_base_dir: "sheetsage/output"
abc: "vgm/"

strip_abc_tempo: false

# --- LoRA Defaults ---
ar_scale: 0.5
nar_scale: 1.0

# --- DSP & Post-Processing (Updated) ---
# Normalization (LUFS)
enable_normalization: true
target_lufs: -14.0

# Live Reverb Effect
enable_reverb: true
reverb_room_size: 0.3
reverb_damping: 0.5
reverb_wet_level: 0.05
reverb_dry_level: 0.95
