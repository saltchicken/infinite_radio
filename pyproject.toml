[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "infinite-radio"
version = "0.2.0"
description = "An infinite AI music generation radio using YuE2"
requires-python = ">=3.10"
dependencies = [
    "sounddevice",
    "soundfile",
    "numpy",
    "accelerate",
    "mir_eval",
    "pretty_midi",
    "mido",
    "scipy",
    "yue2-infer @ git+https://github.com/multimodal-art-projection/YuE.git",
    "torch",
    "torchaudio",
    "safetensors",
    "pyyaml",
    "fastapi",
    "uvicorn",
    "requests",
    "pydantic"
]

[project.scripts]
infinite-radio = "infinite_radio.cli:main"
infinite-radio-server = "infinite_radio.server:main"

[tool.setuptools.package-data]
infinite_radio = ["static/*"]
